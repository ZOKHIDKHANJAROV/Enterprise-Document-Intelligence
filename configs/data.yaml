# Paths are relative to the repository root.
raw_dir: "data/raw"
extracted_dir: "data/extracted"
dataset_dir: "data/dataset"

# Initial controlled experiment.
max_documents: 500
seed: 42

# Dataset split is done by document_id to prevent document-level leakage.
# 80/10/10: with ~2k QA pairs a 5% test set (~100 questions) is too noisy
# to compare base vs QLoRA.
train_ratio: 0.80
validation_ratio: 0.10
test_ratio: 0.10
