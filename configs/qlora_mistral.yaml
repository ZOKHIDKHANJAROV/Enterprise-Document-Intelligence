# EXP-06 comparison model. Run with CONFIG=configs/qlora_mistral.yaml RUN=mistral-7b.
model_name: "mistralai/Mistral-7B-Instruct-v0.3"
output_dir: "models/adapters/mistral-qlora"
# Mistral v0.3 chat template drops the system message when an assistant turn
# follows (training) but keeps it at inference; merge it into the user turn.
merge_system_prompt: true

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  # bfloat16 needs an Ampere+ GPU (RTX 30xx/40xx, A100); use float16 otherwise.
  compute_dtype: "bfloat16"
  double_quant: true

lora:
  # PEFT supports all-linear for QLoRA-style adaptation.
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_modules: "all-linear"

training:
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 0.0001
  weight_decay: 0.01
  fp16: false
  bf16: true
  logging_steps: 10
  # Frequent checkpoints so a paused run (--resume) loses little work.
  eval_steps: 50
  save_steps: 50
  save_total_limit: 2
  optim: "paged_adamw_8bit"
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  # Dense technical text is ~1.8 chars/token: at 1024 tokens 24% of examples
  # (1800-char context + answer) did not fit, at 1280 6%, at 1536 1%. On an
  # 8 GB GPU 1536 overflows into shared memory (19 -> 87 s/step), so 1280.
  max_seq_length: 1280
