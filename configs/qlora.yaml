model_name: "mistralai/Mistral-7B-Instruct-v0.3"
output_dir: "models/adapters/mistral-qlora"

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  compute_dtype: "float16"
  double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 0.0002
  weight_decay: 0.01
  fp16: true
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
  optim: "paged_adamw_8bit"
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  max_seq_length: 1024
