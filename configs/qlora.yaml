# Main model: Qwen3 4B instruct (non-thinking 2507 release). Fits QLoRA on an
# 8 GB GPU at max_seq_length 1024. Mistral 7B is kept in qlora_mistral.yaml.
model_name: "Qwen/Qwen3-4B-Instruct-2507"
output_dir: "models/adapters/qwen3-4b-qlora"

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  # bfloat16 needs an Ampere+ GPU (RTX 30xx/40xx, A100); use float16 otherwise.
  compute_dtype: "bfloat16"
  double_quant: true

lora:
  # PEFT supports all-linear for QLoRA-style adaptation.
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_modules: "all-linear"

training:
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 0.0001
  weight_decay: 0.01
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
  optim: "paged_adamw_8bit"
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  max_seq_length: 1024
